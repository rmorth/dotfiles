$mainMod = SUPER
$terminal = alacritty
$fileManager = dolphin
$menu = fuzzel

exec-once = hyprpm reload -n

plugins {
    plugin = hy3
}

general {
    layout = hy3
}

plugin {
  hy3 {
    tabs {
      height = 24
      padding = 6
      from_top = false
      radius = 0
      border_width = 1

      render_text = true
      text_center = true
      text_font = CommitMono Nerd Font Bold
      text_height = 10
      text_padding = 3

      colors {
        # Active tab (#ff8c3a accent / #000000 text)
        active = rgba(0a060480)
        active_border = rgba(ff8c3aff)
        active_text = rgba(ff8c3aff)

        # Active tab on unfocused monitor (#d9a066 sand)
        active_alt_monitor = rgba(d9a06640)
        active_alt_monitor_border = rgba(d9a066ee)
        active_alt_monitor_text = rgba(0a0604ff)

        # Focused node in unfocused container (#7a5a3a dusty rust)
        focused = rgba(7a5a3a40)
        focused_border = rgba(7a5a3aee)
        focused_text = rgba(d9a066ff)

        # Inactive tab (#0a0604 warm dark / #7a5a3a text)
        inactive = rgba(0a060480)
        inactive_border = rgba(4a3525aa)
        inactive_text = rgba(8a6a4aff)

        # Urgent tab (#c0392b blood orange)
        urgent = rgba(c0392b40)
        urgent_border = rgba(c0392bee)
        urgent_text = rgba(ffffffff)

        # Locked group (#4a3525 deep rust)
        locked = rgba(4a352540)
        locked_border = rgba(4a3525ee)
        locked_text = rgba(d9a066ff)
      }

      blur = true
      opacity = 1.0
    }

    autotile {
      enable = false
    }
  }
}

misc {
    disable_splash_rendering = true
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

input {
    follow_mouse = 2
    sensitivity = 0.0
    accel_profile = flat
    kb_layout = eu
    kb_options = grp:alt_shift_toggle
    repeat_delay = 250
    repeat_rate = 40
}

monitor = DP-1, 3840x2160@240, 0x0, 1, bitdepth, 10
render {
    cm_enabled = true
}

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, Backspace, global, quickshell:system-toggle
bind = $mainMod, B, global, quickshell:bar-toggle
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Space, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, F, fullscreen

bind = $mainMod, H, hy3:movefocus, l
bind = $mainMod, J, hy3:movefocus, d
bind = $mainMod, K, hy3:movefocus, u
bind = $mainMod, L, hy3:movefocus, r
#bind = $mainMod, H, movefocus, l
#bind = $mainMod, J, movefocus, d
#bind = $mainMod, K, movefocus, u
#bind = $mainMod, L, movefocus, r

bind = SUPERSHIFT, H, swapwindow, l
bind = SUPERSHIFT, J, swapwindow, d
bind = SUPERSHIFT, K, swapwindow, u
bind = SUPERSHIFT, L, swapwindow, r

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = SUPERSHIFT, 1, movetoworkspace, 1
bind = SUPERSHIFT, 2, movetoworkspace, 2
bind = SUPERSHIFT, 3, movetoworkspace, 3
bind = SUPERSHIFT, 4, movetoworkspace, 4
bind = SUPERSHIFT, 5, movetoworkspace, 5
bind = SUPERSHIFT, 6, movetoworkspace, 6
bind = SUPERSHIFT, 7, movetoworkspace, 7
bind = SUPERSHIFT, 8, movetoworkspace, 8
bind = SUPERSHIFT, 9, movetoworkspace, 9
bind = SUPERSHIFT, 0, movetoworkspace, 10

bindm = $mainMod, mouse:272, movewindow

bind = $mainMode, R, submap, resize
submap = resize
bind = , l, resizeactive, 50 0
bind = , h, resizeactive, -50 0
bind = , k, resizeactive, 0 -40
bind = , j, resizeactive, 0 40
bind = , escape, submap, reset
submap = reset

bind = $mainMod, s, hy3:changegroup, toggletab  # Toggle between tabbed/tiled

# Enable workspace cycling
binds {
    allow_workspace_cycles = true
}

# Bind to previous workspace
bind = $mainMod, Escape, workspace, previous

# Obsidian scratchpad
bind = $mainMod, O, togglespecialworkspace, obsidian
windowrule = match:class ^(obsidian)$, workspace special:obsidian silent, float on, size 1200 900, center on

# QuickShell global shortcuts
bind = $mainMod SHIFT, W, global, quickshell:wifi-toggle
bind = $mainMod SHIFT, A, global, quickshell:audio-toggle
bind = $mainMod SHIFT, B, global, quickshell:bluetooth-toggle

bind = $mainMod SHIFT, s, exec, grimblast --freeze save area - | satty --output-filename /tmp/screenshot.png --initial-tool brush --copy-command wl-copy --save-after-copy --early-exit --filename -

exec-once = hyprpaper
exec-once = hyprsunset
exec-once = hypridle
# QuickShell bar (replaces waybar)
exec-once = quickshell

# Sync primary selection with clipboard
exec-once = wl-paste -p -t text --watch wl-copy
